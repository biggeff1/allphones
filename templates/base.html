<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AllPhones{% endblock %}</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#101828;color:white;padding:18px 6%;display:flex;justify-content:space-between}main{max-width:1100px;margin:35px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #00000010}.btn{display:inline-block;background:#111827;color:white;padding:11px 16px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}input,textarea{width:100%;padding:10px;margin:5px 0 14px;box-sizing:border-box}label{font-weight:600}.notice{background:#e7f6ec;padding:12px;border-radius:10px;margin-bottom:20px}
  </style>
</head>
<body><header><strong>AllPhones</strong><span>Achat de seconde main, encadré par l'agence</span></header>
<main>{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
</body></html>
